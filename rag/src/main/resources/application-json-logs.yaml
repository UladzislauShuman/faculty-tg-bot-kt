# =============================================================================
# Профиль json-logs: журнал в формате JSON (logstash) вместо цветного текста.
# Нужен, когда журналы разбирает машина (сбор в Loki, Elasticsearch): поля, включая номер обновления из MDC, остаются отдельными.
# Цвет и структурный формат несовместимы, поэтому это отдельный профиль: docker,json-logs.
# =============================================================================
logging:
  structured:
    format:
      console: logstash
spring:
  output:
    ansi:
      enabled: NEVER
