# =============================================================================
# application.yaml — единый конфиг бота ФПМИ БГУ. Все числа и параметры живут здесь.
# -----------------------------------------------------------------------------
# Как читать:
#   - у каждого параметра подпись: что это и на что влияет;
#   - значение стоит явно, даже если оно совпадает с умолчанием библиотеки;
#   - секреты не хранятся в файле: ${ИМЯ} берётся из переменной окружения (см. .env.example);
#   - [паритет] — значение совпадает с Python-версией, менять только после замера на тестовом наборе;
#   - [оценка] — стартовое значение из документов проекта (final_report.md), уточняется по замерам.
# Профили: по умолчанию бот работает с локальным Ollama без Telegram и без HTTP-входа (безопасный запуск для проверки).
#   yandex — YandexGPT основной (провайдер описан в application-yandex.yaml), GigaChat резерв (когда появится); docker — запуск в compose, структурные логи.
# =============================================================================

spring:
  output:
    ansi:
      # ALWAYS: цвет нужен и когда вывод идёт не в терминал (docker compose logs, IDE). Отключается значением NEVER.
      enabled: ALWAYS
  application:
    name: faculty-bot

  datasource:
    # Адрес базы. В compose переопределяется переменной SPRING_DATASOURCE_URL.
    url: jdbc:postgresql://localhost:5432/fpmi_bot
    username: fpmi
    # Пароль только из окружения. Значения по умолчанию нет: бот не стартует с пустым паролем.
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Размер пула соединений. Запросов к базе одновременно не больше bot.database.max-parallel-queries.
      maximum-pool-size: 10
      # Сколько соединений держать открытыми в простое.
      minimum-idle: 2
      # Сколько ждать свободное соединение из пула, мс. Дольше — ошибка вместо зависшего вопроса.
      connection-timeout: 5000
      # Через сколько простоя соединение закрывается, мс.
      idle-timeout: 300000
      # Максимальный срок жизни соединения, мс. Меньше таймаута базы и сетевого оборудования.
      max-lifetime: 1500000

  flyway:
    # Схема базы накатывается миграциями из db/migration при старте. Ручных правок схемы нет.
    enabled: true
    locations: classpath:db/migration

  lifecycle:
    # Сколько Spring ждёт каждую фазу остановки. Приём сообщений Telegram дожидается принятых вопросов (до bot.runtime.shutdown-grace-period).
    timeout-per-shutdown-phase: 120s

  threads:
    virtual:
      # Виртуальные потоки не нужны: блокирующие вызовы вынесены на ограниченные диспетчеры корутин (см. bot.database, bot.runtime.cpu-threads).
      enabled: false

  jackson:
    # Неизвестные поля в запросах HTTP-входа — ошибка клиента, а не молчаливая потеря данных.
    deserialization:
      fail-on-unknown-properties: true

server:
  # HTTP нужен для проб здоровья, метрик и (по желанию) входа для проверок. Порт в compose закрыт от внешней сети.
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Что отдаётся по /actuator: проба здоровья, сведения о сборке, метрики для Prometheus.
        include: health,info,prometheus
  endpoint:
    health:
      # Состав пробы виден без авторизации: порт закрыт, а детали нужны при разборе сбоев.
      show-details: always
      probes:
        enabled: true
  health:
    # Проверка свободного места на диске не нужна: данные лежат в контейнерах с томами.
    diskspace:
      enabled: false

logging:
  level:
    root: INFO
    shuman.bsu.famcs.rag: INFO
    # Клиент Qdrant и gRPC шумят на уровне DEBUG/INFO; предупреждений достаточно.
    io.qdrant: WARN
    io.grpc: WARN
    # Библиотека Telegram логирует каждое обновление, то есть тексты вопросов. В журнал они попадать не должны.
    dev.inmo: WARN
  pattern:
    # Цветной журнал для чтения глазами: время бледное, уровень цветной (ошибки красные, предупреждения жёлтые),
    # номер обновления Telegram из MDC лиловый (связывает строки одного вопроса), класс голубой.
    # Telegram ID и тексты вопросов в журнал не пишутся. Для разбора машиной включается профиль json-logs (без цвета).
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%X{update}]){magenta} %clr(%logger{30}){cyan} %clr(-){faint} %m%n%wEx"


# -----------------------------------------------------------------------------
# bot — всё, что относится к самому боту
# -----------------------------------------------------------------------------
bot:
  # Часовой пояс. Суточные счётчики, ночная индексация и «проверено ДД.ММ.ГГГГ» считаются по нему.
  time-zone: Europe/Minsk
  # Режим обслуживания при старте: бот отвечает всем одним текстом и не тратит токены. Админ переключает командой.
  maintenance-enabled: false

  # Грубая оценка токенов по длине текста (бюджет истории и подсчёт, когда провайдер не вернул расход).
  tokens:
    # Символов на токен для русского текста. 2.5–3.5; меньше значение — осторожнее (токенов считается больше).
    chars-per-token: 3.0

  runtime:
    # Потоков под вычисления моделей на процессоре (эмбеддинги и реранкер вместе). На домашнем ПК с четырьмя ядрами — 3, одно остаётся приложению.
    cpu-threads: 3
    # Сколько ждать при остановке уже принятые вопросы и фоновые задачи. Не меньше потолка обработки вопроса (limits.queue.processing-timeout).
    shutdown-grace-period: 95s

  database:
    # Сколько запросов к базе выполняется одновременно. Не больше maximum-pool-size.
    max-parallel-queries: 8

  privacy:
    # Секрет для хеша Telegram ID в журнале ответов (HMAC). Не короче 16 символов. Только из окружения.
    hash-secret: ${BOT_HASH_SECRET}
    # Сколько символов хеша хранить. 16 шестнадцатеричных знаков = 64 бита.
    hash-length: 16

  # ---------------------------------------------------------------------------
  # Согласие на обработку данных. Смена version требует нового согласия от всех.
  # ---------------------------------------------------------------------------
  consent:
    version: "2026-10"
    text: |
      Привет! Я бот факультета прикладной математики и информатики БГУ. Отвечаю на вопросы по материалам сайта fpmi.bsu.by.

      Чтобы ответить, я передаю текст вашего вопроса языковой модели внешнего провайдера. Telegram ID я храню только для лимитов и диалога, имя, username и телефон не сохраняю. Тексты диалогов хранятся {retention_days} дней. Удалить свои данные можно командой /forget.

      Ответы бота могут содержать ошибки. Сроки, даты и суммы проверяйте на сайте.
    accept-button: Согласен

  # ---------------------------------------------------------------------------
  # Модели языка (LLM): провайдеры, роли, защита
  # ---------------------------------------------------------------------------
  llm:
    providers:
      # Локальный Ollama. Для проверок и разработки; на слабом процессоре отвечает за минуты.
      ollama:
        type: OLLAMA
        base-url: http://localhost:11434
        # Модель, с которой создаётся клиент. Реальную модель каждой роли задаёт её цепочка ниже.
        default-model: llama3.1
        # Верхняя граница ожидания HTTP-клиента. Не меньше самого долгого таймаута вызова среди ролей.
        http-timeout: 180s
        # Одновременных вызовов к Ollama. Один процесс считает один запрос за раз.
        max-concurrent-calls: 1
        ollama:
          # Окно контекста, токены. Без явного значения Ollama берёт 2048 и молча обрезает длинные документы. [паритет: num_ctx 16384]
          context-tokens: 16384
          # Из скольких самых вероятных токенов выбирать следующий.
          top-k: 40
          # Штраф за повторы. 1.0 — без штрафа.
          repeat-penalty: 1.1
          # На сколько токенов назад смотреть при штрафе за повторы.
          repeat-last-tokens: 64
          # Зерно генератора. Не задано — случайное; для воспроизводимых прогонов раскомментируйте и укажите число.
          # seed: 42

    # Роли вызова модели. У каждой свои температура, лимит ответа, таймаут и цепочка провайдеров (основной, затем резервные).
    roles:
      # Выбор ветки: RAG, SCHEDULE, SMALLTALK или GENERAL. Одно слово в ответ, поэтому температура 0 и короткий лимит.
      classifier:
        temperature: 0.0
        top-p: 1.0
        max-output-tokens: 16
        call-timeout: 30s
        chain:
          - { provider: ollama, model: "qwen2.5:14b-instruct-q4_K_M" }
      # Переформулирование вопроса с местоимениями в самостоятельный запрос для поиска.
      rewriter:
        temperature: 0.0
        top-p: 1.0
        max-output-tokens: 128
        call-timeout: 60s
        chain:
          - { provider: ollama, model: "llama3.1" }
      # Ответ по найденным документам. Главная статья расхода токенов. [паритет: temperature 0.3]
      generator:
        temperature: 0.3
        top-p: 0.9
        max-output-tokens: 600
        call-timeout: 120s
        chain:
          - { provider: ollama, model: "llama3.1" }
      # Приветствия и общие вопросы без документов.
      chat:
        temperature: 0.5
        top-p: 0.9
        max-output-tokens: 300
        call-timeout: 60s
        chain:
          - { provider: ollama, model: "llama3.1" }
      # Сжатие старой части диалога в краткую сводку.
      summarizer:
        temperature: 0.0
        top-p: 1.0
        max-output-tokens: 200
        call-timeout: 60s
        chain:
          - { provider: ollama, model: "llama3.1" }
      # Судья качества ответов: «ВЕРНО / НЕВЕРНО / НЕ ЗНАЮ» и причина одной фразой. Вызывается только проверками, не пользователями.
      # Модель отличается от генератора; в профилях внешних провайдеров роль не переопределяется и остаётся на локальном Ollama.
      judge:
        temperature: 0.0
        top-p: 1.0
        max-output-tokens: 150
        call-timeout: 120s
        chain:
          - { provider: ollama, model: "qwen2.5:14b-instruct-q4_K_M" }

    resilience:
      # Размыкатель: если провайдер часто ошибается, его на время перестают вызывать.
      breaker:
        # Окно подсчёта, секунды. [оценка: 5 ошибок за 60 с]
        window-seconds: 60
        # Сколько вызовов минимум нужно в окне, чтобы доля ошибок учитывалась.
        minimum-calls: 5
        # Доля сбоев в окне, при которой размыкатель размыкается, %.
        failure-rate-percent: 50
        # Сколько провайдер остаётся недоступным после размыкания. [оценка: 60 с]
        open-state-wait: 60s
        # Сколько пробных вызовов пропускается после паузы, чтобы проверить, ожил ли провайдер.
        half-open-probe-calls: 2
      retry:
        # Повторов у основного провайдера после временного сбоя (5xx, таймаут). [оценка: один повтор]
        retries-on-primary: 1
        # Повторов у резервного. Резерв — последняя надежда, повторы только отнимают время.
        retries-on-fallback: 0
        # Пауза перед повтором.
        backoff: 1s
        # Случайный разброс паузы (0.5 = плюс-минус половина): разводит одновременные повторы.
        jitter: 0.5
      # На сколько откладывать провайдера, у которого кончилась квота или деньги. [оценка: ≈ 1 ч]
      quota-pause: 1h

    reply-validation:
      # Ответ короче этого числа символов считается пустым и не показывается пользователю.
      min-chars: 2
      # Окно поиска зацикливания в ответе, символы: хвост такой длины сравнивается с остальным текстом.
      loop-window-chars: 80
      # Сколько раз хвост должен повториться, чтобы ответ посчитали зацикленным.
      loop-repeats: 4

  # ---------------------------------------------------------------------------
  # Диалог: сессии, память, переформулирование
  # ---------------------------------------------------------------------------
  dialog:
    session:
      # Пауза, после которой следующий вопрос начинает новую сессию. [оценка: 2 ч]
      idle-timeout: 2h
    memory:
      # Бюджет последних реплик в промпте, токены. [оценка: ≈ 1000 токенов]
      history-budget-tokens: 1000
      # Сколько последних пар «вопрос — ответ» остаётся в промпте дословно. [оценка: 3]
      max-pairs: 3
      # Длина сводки старой части диалога, символы. [оценка: ≈ 300 токенов ≈ 900 символов]
      summary-max-chars: 900
      # Сколько последних сообщений сессии читается из базы.
      max-messages-read: 40
    rewrite:
      # OFF — не переформулировать; WHEN_HISTORY — только когда есть история; ALWAYS — всегда. [паритет: WHEN_HISTORY]
      mode: WHEN_HISTORY
      # Ответ модели длиннее — это не переформулировка, а ответ на вопрос: он отбрасывается. Символы.
      max-chars: 400

  # Классификатор веток. OFF — все вопросы идут в RAG (как в базовой версии); LLM — ветку выбирает модель.
  intent:
    mode: LLM

  rag:
    # Фраза «не нашёл». Должна совпадать с фразой в prompts/answer-system.txt: иначе бот не запустится.
    no-info-marker: "в моей базе знаний пока нет точной информации"
    # Сколько источников показывать под ответом. [оценка: до трёх]
    max-sources: 3

  alerts:
    # Как часто повторяется оповещение администратору одного вида (квота, недоступность моделей, внутренняя ошибка).
    min-interval: 1h

  # Сборка ответа
  reply:
    # Заголовки страниц сайта имеют вид «Раздел | Название сайта»; в источниках остаётся часть до разделителя.
    title-separator: " | "
    # Ответы со сроками, датами, суммами получают оговорку «проверьте актуальность». Эвристика: ловит лишнее чаще, чем пропускает.
    date-caveat-pattern: "\\d{1,2}\\.\\d{1,2}(\\.\\d{2,4})?|\\d{1,2}\\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)|срок\\w*|дедлайн|не позднее|оплат\\w*|стоимост\\w*"

  # Тексты ответов без участия модели. Метки {имя} подставляются в момент ответа.
  messages:
    no-info: "К сожалению, в моей базе знаний пока нет точной информации по этому вопросу."
    no-info-hint: "Попробуйте поискать на сайте факультета: https://fpmi.bsu.by"
    schedule: "Актуальное расписание смотрите на сайте факультета: https://fpmi.bsu.by (раздел «Расписание»)."
    rate-limited-minute: "Слишком много вопросов подряд. Повторите, пожалуйста, через {seconds} с."
    rate-limited-day: "На сегодня лимит вопросов исчерпан ({limit} в сутки). Продолжим завтра."
    busy: "Я ещё отвечаю на предыдущий вопрос. Подождите немного."
    overloaded: "Сейчас много запросов, не получилось ответить. Попробуйте через несколько минут."
    budget-exhausted: "На сегодня лимит работы бота исчерпан. Попробуйте завтра или найдите ответ на сайте: https://fpmi.bsu.by"
    error: "Что-то пошло не так. Попробуйте ещё раз немного позже."
    consent-required: "Чтобы продолжить, нужно согласие на обработку данных. Нажмите /start."
    unsupported-input: "Пока я понимаю только текст. Напишите вопрос словами."
    too-long: "Вопрос слишком длинный. Сократите его до {limit} символов."
    maintenance: "Бот на обслуживании. Скоро вернусь."
    sources-title: "Источники:"
    checked-on: "проверено {date}"
    date-caveat: "Сроки и суммы могут меняться: проверьте актуальность на сайте факультета."

  # ---------------------------------------------------------------------------
  # Лимиты и защита бюджета
  # ---------------------------------------------------------------------------
  limits:
    user:
      # Вопросов за скользящую минуту. [оценка: 5]
      per-minute: 5
      # Вопросов в сутки. [оценка: 20]
      per-day: 20
      # Вопросов в сутки в режиме экономии. [оценка: 10]
      per-day-in-economy: 10
    system:
      # Потолок вопросов всех пользователей в сутки. [оценка: ≈ 500]
      messages-per-day: 500
      # Потолок токенов в сутки. 2 млн токенов ≈ $3.3 на YandexGPT Lite ($1.64 за млн) ≈ $100 за 30 суток: совпадает с потолком бюджета. [оценка]
      tokens-per-day: 2000000
      # С этой доли потолка токенов включается режим экономии, %. [оценка: 70]
      economy-threshold-percent: 70
      # С этой доли потолка администратору уходит предупреждение, %. [оценка: 80]
      alert-threshold-percent: 80
    queue:
      # Вопросов обрабатывается одновременно. Меньше квоты провайдера.
      max-concurrent: 4
      # Вопросов может ждать очереди. Остальные сразу получают «перегрузка». [оценка: 50–100]
      max-waiting: 50
      # Сколько вопрос ждёт очереди. [оценка: 60 с]
      max-wait: 60s
      # Потолок обработки одного вопроса с момента, как он занял место. [оценка: 90 с]
      processing-timeout: 90s
    updates:
      # Сообщения старше этого возраста (после простоя бота) молча пропускаются. [оценка: 3 ч]
      max-age: 3h
      # Сколько хранятся номера обработанных обновлений (защита от повторной доставки). [оценка: 7 дней]
      retention: 7d
    input:
      # Самый длинный вопрос, символы. [оценка: 1000]
      max-question-chars: 1000

  # Сроки хранения. Обещание пользователю в тексте согласия.
  retention:
    # Дни хранения текстов диалогов.
    messages-days: 90
    # Дни хранения журнала ответов (с запросами и оценками).
    answer-log-days: 90
    # Дни хранения суточных счётчиков пользователей.
    usage-days: 90
    # Суточная очистка (Spring cron: секунда минута час день месяц день_недели). 04:30 — после ночной индексации.
    cron: "0 30 4 * * *"
    # Как часто память процесса очищается от давно не писавших пользователей.
    memory-sweep-interval: 1h

  # ---------------------------------------------------------------------------
  # Telegram. По умолчанию выключен: ядро работает без токена (HTTP-вход, тесты).
  # ---------------------------------------------------------------------------
  telegram:
    enabled: false
    # Токен бота от @BotFather. Только из окружения.
    token: ${BOT_TELEGRAM_TOKEN:}
    # Telegram ID администраторов через запятую. Только они вызывают /admin_*.
    admin-ids: ${BOT_ADMIN_IDS:}
    # Сколько Telegram держит запрос длинного опроса открытым, пока нет сообщений. Должно быть меньше 30 с: таймаут запроса
    # в клиенте ktgbotapi 30 с, при равных значениях каждый пустой опрос заканчивался ошибкой.
    poll-timeout: 20s
    # Как часто обновляется «печатает…» (Telegram гасит индикатор через 5 с).
    typing-interval: 4s
    # Через сколько после вопроса показывать «печатает…». Мгновенные отказы (нет согласия, лимит, дубль) индикатора не вызывают.
    typing-start-delay: 1s
    # Сколько обновлений обрабатывается одновременно до очереди ядра; сверх лимита обновление отбрасывается (защита от потока сообщений).
    max-concurrent-updates: 200
    # Длина одного сообщения Telegram. Лимит платформы — 4096.
    message-max-chars: 4000
    # Повторов отправки при ответе Telegram «слишком часто» (429). Пауза берётся из ответа Telegram.
    send-retries: 2
    # Пауза после ошибки приёма обновлений (нет сети, неверный токен). Без паузы библиотека повторяет запрос мгновенно и журнал
    # заполняется миллионами одинаковых строк за минуты.
    error-pause: 5s
    # Подпись кнопки оценки. {n} — число от 1 до 5.
    rating-label: "{n} ⭐"
    texts:
      welcome: "Здравствуйте! Задайте вопрос о факультете — отвечу по материалам сайта. Команды: /new — начать новый диалог, /help — справка, /forget — удалить мои данные."
      help: "Я отвечаю на вопросы о ФПМИ БГУ по материалам сайта fpmi.bsu.by: поступление, учёба, практика, документы. Под ответом можно поставить оценку. /new — начать диалог заново, /forget — удалить мои данные."
      new-session: "Хорошо, начинаем новый диалог. Предыдущий контекст забыт."
      forget-confirm: "Удалить ваши данные: диалоги и оценки? Это нельзя отменить. Счётчик вопросов за день останется без привязки к вам, чтобы дневной лимит нельзя было обойти."
      forget-button: "Удалить"
      forgotten: "Готово, данные удалены. Чтобы продолжить пользоваться ботом, нажмите /start."
      consent-accepted: "Согласие принято"
      rating-thanks: "Спасибо за оценку!"
      unknown-command: "Не знаю такой команды. Напишите вопрос словами или нажмите /help."
      not-admin: "Эта команда только для администраторов."

  admin:
    # За какой период считается /admin_stats.
    stats-window: 24h
    # За какой период собираются вопросы без ответа в /admin_gaps.
    gaps-window: 7d
    # Сколько строк показывать в списках.
    list-limit: 10
    # Сколько символов вопроса и ответа показывать в разборе низких оценок.
    excerpt-chars: 300

  # HTTP-вход для проверок без Telegram. По умолчанию выключен.
  http:
    enabled: false
    # Ключ в заголовке X-Api-Key, не короче 16 символов. Только из окружения.
    api-key: ${BOT_HTTP_API_KEY:}
    # Автоматически записывать согласие тестовым пользователям.
    auto-consent: true

  health:
    # Сколько фрагментов должно быть в базе знаний, чтобы проба здоровья была зелёной. Пустая база — индексация не прошла.
    min-knowledge-chunks: 50

  # ---------------------------------------------------------------------------
  # База знаний: нарезка, модели на процессоре, поиск, Qdrant, обход сайта, индексация
  # ---------------------------------------------------------------------------
  knowledge:
    chunking:
      # Размер дочернего фрагмента для поиска, символы. [паритет: 300]
      child-size: 300
      # Перекрытие соседних фрагментов, символы. [паритет: 50]
      child-overlap: 50
      # Разделители от крупного к мелкому; пустая строка в конце — резать по символам. [паритет]
      child-separators: ["\n\n", "\n", ".", " ", ""]
      # Заголовки до какого уровня делят страницу на разделы-родители (3 = #, ##, ###). [паритет]
      header-levels: 3
      # Предельный размер родительского раздела, символы; длиннее делится на окна по абзацам. 0 — без ограничения.
      # Хроники по годам были одним разделом до 24 тыс. знаков, а реранкер читает около 1500–2000. Замер: до 1500 знаков поиск не хуже, промпт втрое короче.
      # [отличие от Python: там родитель не ограничен, настройка parent_chunk_size не работает]
      parent-max-chars: 1500
      # CSS-селекторы блока с основным содержимым по порядку приоритета. [паритет]
      content-selectors: ["div#block-famcs-content", "article"]
      # Теги, вырезаемые из блока. [паритет]
      removed-tags: ["script", "form", "nav", "header", "footer"]
      # Экранирование символов Markdown, как у markdownify. [паритет]
      escape-asterisks: true
      escape-underscores: true
      # Маркеры вложенных списков по уровням. [паритет]
      bullets: "*+-"
      # Приводить относительные ссылки к абсолютным. В baseline не делалось; включать после проверки на тестовом наборе.
      absolutize-links: false

    embedding:
      # Эмбеддинги BAAI/bge-m3 в формате ONNX. Файлы готовит scripts/prepare-models.sh. [паритет]
      model-path: models/bge-m3/model.onnx
      tokenizer-path: models/bge-m3/tokenizer.json
      # Размерность вектора bge-m3.
      dimension: 1024
      # Длина входа в токенах; что длиннее, обрезается.
      max-tokens: 512
      # Текстов за один проход модели.
      batch-size: 8
      # Потоков внутри одной операции модели.
      intra-op-threads: 3
      # Название выхода модели с вектором предложения.
      output-name: sentence_embedding

    sparse:
      # FASTEMBED_COMPATIBLE — как в baseline (английские стоп-слова и стеммер, русские слова как есть); RUSSIAN — эксперимент. [паритет]
      analyzer: FASTEMBED_COMPATIBLE
      # Параметр k BM25. [паритет: 1.2]
      k: 1.2
      # Параметр b BM25. [паритет: 0.75]
      b: 0.75
      # Средняя длина документа в термах (константа, как у FastEmbed). [паритет: 256]
      average-length: 256.0
      # Термы длиннее пропускаются. [паритет: 40]
      max-token-length: 40
      # Модификатор IDF у sparse-вектора. В baseline выключен. [паритет]
      idf-modifier: false

    search:
      # Кандидатов от каждого из двух поисков (по смыслу и по словам) до слияния. [паритет: 10]
      candidates-per-leg: 10
      # Кандидатов после слияния.
      result-limit: 10
      # RRF — слияние рангов без весов, как в baseline; WEIGHTED_RRF — с весами, эксперимент. [паритет]
      fusion: RRF
      # Константа сглаживания RRF (для WEIGHTED_RRF).
      rrf-k: 2
      # Вес поиска по смыслу (для WEIGHTED_RRF).
      dense-weight: 0.7
      # Вес поиска по словам (для WEIGHTED_RRF).
      sparse-weight: 0.3
      # Ширина поиска в графе HNSW. Больше — точнее и медленнее.
      hnsw-ef: 128

    reranker:
      # Реранкер DiTy/cross-encoder-russian-msmarco в ONNX. [паритет]
      enabled: true
      model-path: models/reranker/model.onnx
      tokenizer-path: models/reranker/tokenizer.json
      max-tokens: 512
      batch-size: 8
      intra-op-threads: 3
      output-name: logits
      # Сколько лучших разделов уходит в контекст. [паритет: 3]
      top-n: 3

    qdrant:
      host: localhost
      # Порт gRPC (не REST).
      grpc-port: 6334
      use-tls: false
      api-key: ${QDRANT_API_KEY:}
      # Имя, по которому ищет бот. За ним физическая коллекция; при полной пересборке указатель переключается.
      collection-alias: fpmi_docs
      dense-vector-name: dense
      sparse-vector-name: sparse
      # Точек в одном запросе записи.
      upsert-batch-size: 64
      request-timeout: 30s
      # Связей на узел графа HNSW (параметры построения индекса).
      hnsw-m: 16
      hnsw-ef-construct: 100
      # Сколько прежних коллекций хранить после переключения, чтобы можно было откатиться.
      keep-old-collections: 1

    crawler:
      # Адрес, с которого начинается обход. Главная страница: с /about (как было в Python) не находились около 50 страниц, в том числе
      # старые новости и часть разделов, на которые ссылается только главная.
      start-url: https://fpmi.bsu.by/
      # Максимальная глубина переходов. [паритет: 10]
      max-depth: 10
      # Пауза между запросами к сайту. [оценка: не чаще одного запроса в секунду]
      delay-between-requests: 1s
      # Честное представление: сайт видит, кто и зачем его обходит. Только ASCII: заголовки HTTP не допускают кириллицу.
      user-agent: "FpmiBsuBot/0.1 (student project of FAMCS BSU; answers students from site materials)"
      request-timeout: 10s
      # Повторов при временном сбое.
      max-retries: 2
      retry-backoff: 2s
      # Расширения файлов, которые не скачиваются как страницы. [паритет]
      excluded-extensions: [".pdf", ".jpg", ".png", ".zip", ".docx", ".xlsx"]
      # Части пути, по которым ссылки пропускаются. [паритет]
      excluded-path-parts: ["/admin", "/user"]
      # Читать robots.txt и не заходить в запрещённые разделы.
      respect-robots-txt: true
      # Параметр, которым сайт листает списки новостей (/announcement?page=3). Такие страницы обходятся ради ссылок на новости,
      # но как документы не сохраняются. Пусто — параметры запроса отбрасываются (как в Python: тогда терялись новости со 2-й страницы списка).
      pagination-parameter: page
      # Склеивать страницы с несколькими адресами по каноническому адресу (<link rel="canonical">): в базе одна копия, источник — канонический адрес.
      use-canonical-url: true
      # Сайт отдаёт неполную цепочку сертификатов (причина verify=False в Python). Промежуточный сертификат лежит в ресурсах, проверка TLS включена.
      extra-certificates:
        - classpath:tls/globalsign-rsa-ov-ssl-ca-2018.pem

    indexing:
      # Ночная индексация (Spring cron). [оценка: 03:00 раз в сутки]
      cron: "0 0 3 * * *"
      # Запустить индексацию при старте, если база знаний пуста.
      index-on-empty-start: true
      # Страниц параллельно. Эмбеддинги на процессоре, поэтому немного.
      parallel-pages: 2
      # Если ошибок больше этой доли страниц, обновление не применяется и остаётся прежняя версия.
      max-failed-share: 0.2
      # Если страниц найдено меньше этой доли от прошлого раза, обновление не применяется (сайт мог упасть).
      min-pages-share-of-previous: 0.7
