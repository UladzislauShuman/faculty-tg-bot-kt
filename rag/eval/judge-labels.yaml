  question: "Что ты знаешь про олимпиаду 'IT-Планета'?"
  reference: "Это масштабное соревнование в области IT в России и СНГ для студентов до 25 лет."
  answer: "Международная олимпиада в сфере информационных технологий «IT-Планета» – одно из самых масштабных и престижных соревнований в области информационных технологий в России и странах СНГ. К участию приглашаются студенты в возрасте до 25 лет включительно. Свои силы могут проверить жители любой страны мира, владеющие русским языком.  \nСоревнования проходят в различных номинациях \"Программирование\", \"Облачные вычисления и базы данных\", \"Телеком\", \"Мобильные платформы\", \"Цифровое творчество\", \"Свободное ПО и робототехника\" и \"Неограниченные возможности\" и других в формате технического  и творческого конкурсов. Каждый участник может попробовать себя в любом количестве конкурсов. Отборочные этапы на знание соответствующих конкурсу технологий участникам предстоит пройти в онлайн-режиме. Показавшие лучшие результаты участники будут приглашены на финал олимпиады.  \nКаждый этап – это возможность проверить уровень своего профессионализма, установить контакты с представителями потенциальных работодателей и получить приятные бонусы и награды от спонсоров и организаторов: сертификаты об участии в соревнованиях, дипломы, медали и ценные призы.  \nДля участия в соревнованиях необходимо пройти регистрацию на сайте [world-it-planet.org](http://world-it-planet.org/) в сроки, указанные в правилах каждого конкурса**."
